[package]
name = "rnaseq-alignment-flow"
kind = "flow"
version = "0.1.0"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/rnaseq-alignment-flow"

[command]
name = "taf-rnaseq-alignment-flow"

[runtime]
pipe = false
command_mode = false

[meta]
domain = "bio"
categories = ["rna-seq", "alignment", "bam", "workflow", "transcriptomics"]
keywords = ["rnaseq-alignment-flow", "rna-seq", "HISAT2", "spliced-alignment", "BAM", "samtools", "fastp", "MultiQC", "transcriptomics"]
description = "TAFFISH RNA-seq alignment flow for turning FASTQ sample tables and a prebuilt HISAT2 index into coordinate-sorted BAM/BAI files, summaries, MultiQC, and provenance."

[upstream]
name = "rnaseq-alignment-flow"
type = "taffish-flow"
homepage = "https://github.com/taffish/rnaseq-alignment-flow"
version = "0.1.0"
license = "Apache-2.0"
description = "TAFFISH-maintained RNA-seq alignment flow composed from version-pinned HISAT2, SAMtools, fastp, and MultiQC TAFFISH tool apps."

[dependencies]
taf-fastp = "1.3.3-r3"
taf-hisat2 = "2.2.2-r2"
taf-samtools = "1.23.1-r1"
taf-multiqc = "1.35-r2"
